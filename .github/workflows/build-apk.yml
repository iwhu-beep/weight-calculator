name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则自动读取 package.json）'
        required: false
        default: ''
      release:
        description: '是否发布到 Releases'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      KEY_ALIAS: wc-release
      KEYSTORE_PASSWORD: WcSign2026
      KEY_PASSWORD: WcSign2026

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 36 需要单独装平台包，runner 预装的通常落后一个大版本
      - name: Install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Install dependencies
        run: npm ci

      # 版本号单一来源：package.json；手动触发时填写的版本号优先
      - name: Resolve version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon and splash
        run: npx capacitor-assets generate --android

      # 原生工程不进仓库，版本号与签名配置每次构建时注入
      - name: Patch version and signing config
        run: node scripts/patch-android.mjs

      - name: Restore keystore
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          base64 -d signing/android-release.p12.b64 > "$RUNNER_TEMP/signing/release.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/signing/release.p12" >> "$GITHUB_ENV"

      - name: Sync Android project
        run: npx cap sync android

      # Gradle 依赖体积大且下载慢，缓存后可省 2-3 分钟
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-8.14.3-agp-8.13.0
          restore-keys: gradle-8.14.3-

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VERSION="${{ github.event.inputs.version || steps.version.outputs.value }}"
          cp android/app/build/outputs/apk/release/app-release.apk "weight-calculator-v${VERSION}.apk"
          echo "APK size: $(du -h "weight-calculator-v${VERSION}.apk" | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: weight-calculator-v*.apk
          retention-days: 90

      - name: Create GitHub Release
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || steps.version.outputs.value }}
          name: 称重色粉计算器 v${{ github.event.inputs.version || steps.version.outputs.value }}
          body: |
            ## 称重色粉计算器 v${{ github.event.inputs.version || steps.version.outputs.value }}

            | 平台 | 文件 |
            |---|---|
            | Android | weight-calculator-v${{ github.event.inputs.version || steps.version.outputs.value }}.apk |
            | iOS | App.ipa（由 Build iOS IPA 工作流产出） |

            **Android 安装：** 下载 APK 直接安装，需在系统设置中允许「安装未知来源应用」。

            **iOS 安装：** 下载 App.ipa，使用巨魔 / Apple Configurator 2 / 爱思助手安装。

            签名说明：APK 使用项目自签名证书（有效期 30 年），同版本升级可直接覆盖安装，无需卸载。
          files: weight-calculator-v*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
